[build]
  # Netlify will auto-detect Next.js and use the right adapter
  # But we can specify the build command explicitly
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Ensure Node.js version compatibility
  NODE_VERSION = "20"

# Handle Next.js server-side rendering
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-DNS-Prefetch-Control = "on"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Cache static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www to non-www (or vice versa - choose one)
# This example redirects www to non-www
[[redirects]]
  from = "https://www.astrowavegh.com/*"
  to = "https://astrowavegh.com/:splat"
  status = 301
  force = true

# Handle client-side routing for Next.js
# Netlify plugin handles this automatically, but just in case:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
