<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- AstroWave Icon - AWE Text Only -->
  <defs>
    <linearGradient id="aweGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main "AWE" text -->
  <text x="32" y="42" 
        font-family="'Bebas Neue', 'Arial Black', sans-serif" 
        font-size="36" 
        font-weight="700"
        fill="url(#aweGrad)" 
        text-anchor="middle" 
        letter-spacing="2"
        filter="url(#glow)">
    AWE
  </text>
  
  <!-- Subtle wave underline accent -->
  <path d="M10 50 C18 46, 26 54, 34 50 C42 46, 50 54, 54 50" 
        stroke="#00FF87" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.7"/>
</svg>