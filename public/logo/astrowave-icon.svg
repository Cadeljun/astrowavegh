<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- AstroWave Icon - Wave design -->
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Primary wave -->
  <path d="M8 32 C14 20, 20 20, 26 28 C32 36, 38 36, 44 24 C50 12, 56 12, 62 24" 
        stroke="url(#waveGrad)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Secondary wave (subtle) -->
  <path d="M8 38 C14 26, 20 26, 26 34 C32 42, 38 42, 44 30 C50 18, 56 18, 62 30" 
        stroke="#0EA5E9" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        opacity="0.4"/>
</svg>