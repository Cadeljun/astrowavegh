<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg">
  <!-- AstroWave Logo - White text for dark backgrounds -->
  <defs>
    <linearGradient id="aweGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main "AWE" text -->
  <text x="16" y="36" 
        font-family="'Bebas Neue', 'Arial Black', sans-serif" 
        font-size="40" 
        font-weight="700"
        fill="url(#aweGradient)" 
        letter-spacing="4"
        filter="url(#glow)">
    AWE
  </text>
  
  <!-- Subtle wave underline accent -->
  <path d="M16 42 C28 38, 40 46, 52 42 C64 38, 76 46, 88 42" 
        stroke="#00FF87" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.6"/>
</svg>