<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg">
  <!-- AstroWave Logo - White text for dark backgrounds -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Wave icon -->
  <path d="M8 28 C14 16, 20 16, 26 24 C32 32, 38 32, 44 20 C50 8, 56 8, 62 20" 
        stroke="url(#waveGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M8 34 C14 22, 20 22, 26 30 C32 38, 38 38, 44 26 C50 14, 56 14, 62 26" 
        stroke="#0EA5E9" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round" 
        opacity="0.4"/>
  
  <!-- AW Text -->
  <text x="72" y="34" 
        font-family="'Bebas Neue', 'Arial Black', sans-serif" 
        font-size="32" 
        fill="#F0F8FF" 
        letter-spacing="3">
    AW
  </text>
  
  <!-- Subtle "entertainment" subtitle -->
  <text x="112" y="34" 
        font-family="'Outfit', 'Inter', sans-serif" 
        font-size="10" 
        fill="#F0F8FF" 
        opacity="0.5"
        letter-spacing="2"
        text-anchor="start">
    ENTERTAINMENT
  </text>
</svg>